name: Collector Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.7', '3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover -s tests -v
      - name: Test root-only menu behavior
        run: sudo "$(command -v python3)" -m unittest discover -s tests -p test_field_kit.py -v
      - name: Test extracted distribution
        run: |
          ./scripts/build-package.sh
          mkdir -p "$RUNNER_TEMP/pmt-release"
          tar -xzf dist/pmt-raw-capture-$(tr -d '[:space:]' < VERSION).tar.gz -C "$RUNNER_TEMP/pmt-release"
          cd "$RUNNER_TEMP/pmt-release"/pmt-raw-capture-*
          ./pmt-capture --version
          python3 -m unittest discover -s tests -v